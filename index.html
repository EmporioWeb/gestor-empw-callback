<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Gestor EMPW — conectando</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; text-align: center; color: #222; background: #fff; }
  a.botao { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #3483fa; color: #fff; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<h2>Conectando ao Gestor EMPW…</h2>
<p id="msg">Repassando a autorização (Mercado Livre / Shopee) para o seu computador.</p>
<p><a class="botao" id="continuar" href="#" hidden>Continuar</a></p>
<script>
  // Página-ponte: o Mercado Livre não aceita redirecionar para "localhost",
  // então ele manda para cá e esta página repassa para o sistema no seu PC.
  // A Shopee usa a mesma ponte. Não guarda nada. O destino é fixo e só os parâmetros da lista são repassados.
  (function () {
    var DESTINO = "http://localhost:8080/callback";
    // shop_id / main_account_id: a Shopee devolve a loja que autorizou junto com o code.
    var PERMITIDOS = ["code", "state", "error", "error_description", "shop_id", "main_account_id"];
    var recebido = new URLSearchParams(window.location.search);
    var repassar = new URLSearchParams();
    PERMITIDOS.forEach(function (nome) {
      if (recebido.has(nome)) repassar.set(nome, recebido.get(nome));
    });
    var msg = document.getElementById("msg");
    if (!repassar.has("code") && !repassar.has("error")) {
      msg.textContent = "Nenhuma autorização recebida. Inicie a conexão pelo arquivo \"Conectar conta ML.bat\" ou \"Conectar loja Shopee.bat\".";
      return;
    }
    var url = DESTINO + "?" + repassar.toString();
    var botao = document.getElementById("continuar");
    botao.href = url;
    botao.hidden = false;
    msg.textContent = "Se não avançar sozinho em alguns segundos, clique em Continuar.";
    window.location.replace(url);
  })();
</script>
</body>
</html>
